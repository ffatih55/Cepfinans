 for(let i=0;i<n;i++){const x=10+i*sl+sl*.1,hi=I[i]/mx*100,he=E[i]/mx*100,lb=k=='W'?WL[i]:k=='Y'?YL[i]:((i+1)%5==0||i==0?i+1:'');bars+=`<rect x="${x}" y="${115-hi}" width="${bw}" height="${hi}" rx="2" style="fill:var(--gr)"/><rect x="${x+bw+1}" y="${115-he}" width="${bw}" height="${he}" rx="2" style="fill:var(--rd)"/><text x="${x+bw}" y="132" font-size="9" fill="#8B8B96" text-anchor="middle">${lb}</text>`}

 const cs=Object.entries(r.c).sort((x,y)=>y[1]-x[1]),R=52,C=2*Math.PI*R;let acc=0,don='';cs.forEach(([c,v])=>{const l=v/r.exp*C;don+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${CC[c]||'#94A3B8'}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;acc+=l});

function delAcc(id){if(S.acc.length<2){alert('En az bir hesap kalmalı.');return}const a=S.acc.find(x=>x.id==id),rel=S.tx.filter(t=>t.acc==id||t.to==id),o=S.acc.filter(x=>x.id!=id);
 if(!rel.length){if(confirm(a.name+' silinsin mi?')){S.acc=o;S.rec.forEach(r=>{if(r.acc==id)r.acc=o[0].id});selAcc=from=to=null;go()}return}

function parseMidas(t){t=String(t).replace(/[−–—]/g,'-').trim();const f=x=>parseFloat(x.replace(',','.'));let m=t.match(/([+-])?\s*%\s*(\d+(?:[.,]\d+)?)/)||t.match(/([+-])?\s*(\d+(?:[.,]\d+)?)\s*%/);if(!m&&/^[+-]?\s*\d+(?:[.,]\d+)?$/.test(t))m=t.match(/([+-])?\s*(\d+(?:[.,]\d+)?)/);if(!m)return null;const v=f(m[2]);return m[1]=='-'?-v:v}
function applyMidasDaily(p,manual,sig,info){
 if(typeof p!='number'||!isFinite(p)){toast('Getiri yüzdesi bulunamadı');return false}
 if(!manual){if(Math.abs(p)<0.005)return false;if(sig&&S.set.lastKpiSig==sig)return false}
 if(S.set.lastMidasSync==todayStr()){if(!manual)return false;if(!confirm('Bugün zaten bir getiri işlendi. Yine de eklensin mi?'))return false}
 const m=S.acc.find(a=>a.name.toLowerCase().includes('midas'));if(!m){toast('Midas adında hesap yok');return false}
 const diff=Math.round(bal(m)*p)/100;if(diff==0){toast('Tutar sıfır, kayıt yapılmadı');return false}
 const lab=(p>0?'+':'')+'%'+p.toFixed(2).replace('.',',');
 S.tx.unshift({id:S.nid++,type:'Y',desc:'KPI Fonu Günlük Getiri ('+lab+')',amt:diff,cat:'Yatırım',day:TD(),acc:m.id,to:0});
 S.set.lastMidasSync=todayStr();if(sig)S.set.lastKpiSig=sig;S.set.lastKpiInfo={t:todayStr(),l:lab,d:info||''};go();toast('Midas: '+(diff>0?'+':'')+tl(diff)+' işlendi');return true}
function syncKpiFund(pct,price,date){const p=typeof pct=='number'?pct:parseMidas(pct);if(p===null||!isFinite(p)||p==0)return false;
 if(!date&&!price){const wd=new Date().getDay();if(wd==0||wd==6)return false}
 return applyMidasDaily(p,false,(date||price)?(date||'')+'_'+(price||''):null,date)}
function midManual(){const e=document.getElementById('mid');if(e&&e.value.trim()){const p=parseMidas(e.value);if(p===null)toast('Yüzde bulunamadı');else applyMidasDaily(p,true)}else toast('Bir yüzde ya da metin gir')}

 if(syncKpiFund(p,pr,dt))S.set.kpiOk=true}
